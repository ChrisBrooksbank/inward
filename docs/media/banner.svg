<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Inward</title>
  <desc id="desc">Concentric rings slowly breathing beside the words: Inward, learn to listen to your body.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="55%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0" />
    </radialGradient>
    <style>
      .ring { fill: none; stroke: #c7d2fe; transform-origin: 250px 180px; animation: breathe 6s ease-in-out infinite; }
      .r2 { animation-delay: -1.5s; }
      .r3 { animation-delay: -3s; }
      .r4 { animation-delay: -4.5s; }
      .core { transform-origin: 250px 180px; animation: beat 1.1s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { transform: scale(0.82); opacity: 0.15; }
        50% { transform: scale(1.08); opacity: 0.7; }
      }
      @keyframes beat {
        0%, 100% { transform: scale(1); }
        12% { transform: scale(1.25); }
        24% { transform: scale(1); }
        36% { transform: scale(1.12); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring, .core { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)" />
  <circle cx="250" cy="180" r="170" fill="url(#glow)" />

  <circle class="ring r1" cx="250" cy="180" r="140" stroke-width="1.5" />
  <circle class="ring r2" cx="250" cy="180" r="108" stroke-width="2" />
  <circle class="ring r3" cx="250" cy="180" r="76" stroke-width="2.5" />
  <circle class="ring r4" cx="250" cy="180" r="46" stroke-width="3" />
  <circle cx="250" cy="180" r="30" fill="none" stroke="#ffffff" stroke-width="4" />
  <circle class="core" cx="250" cy="180" r="9" fill="#ffffff" />

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="470" y="170" font-size="96" font-weight="800" letter-spacing="-2">Inward</text>
    <text x="474" y="222" font-size="30" font-weight="500" fill="#c7d2fe">learn to listen to your body</text>
    <text x="474" y="276" font-size="18" font-weight="600" fill="#a5b4fc" letter-spacing="3">NOTICE  ·  DESCRIBE  ·  CONNECT  ·  SHARE</text>
  </g>
</svg>
